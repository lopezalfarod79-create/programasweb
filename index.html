
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login QR</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1120;
    color:white;
}

.login{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#07111f;
}

.caja{
    width:360px;
    background:#111827;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 25px #00eaff;
}

.qr{
    width:240px;
    height:240px;
    background:white;
    padding:10px;
    border-radius:15px;
}

input{
    width:90%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
}

button{
    width:95%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#00eaff;
    font-weight:bold;
    cursor:pointer;
}

#error{
    color:red;
    font-weight:bold;
}

#pagina{
    display:none;
    padding:40px;
}

.tarjeta{
    background:#111827;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

.info{
    display:none;
    margin-top:10px;
    background:#1f2937;
    padding:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="login" id="login">
<div class="caja">

<h1>🔐 LOGIN QR</h1>

<p>Escanea el código QR</p>

<img src="./codigo_qr.png" class="qr">

<p><b>Código:</b> ACCESO2026</p>

<input type="text" id="codigo" placeholder="Ingresa el código">

<button onclick="entrar()">Entrar</button>

<p id="error"></p>

</div>
</div>

<div id="pagina">

<h1>💻 Academia de Programación</h1>

<div class="tarjeta">
<h2>Python</h2>
<button onclick="mostrar('p1')">Enseñar</button>
<div class="info" id="p1">
<p>Python sirve para inteligencia artificial y programas.</p>
</div>
</div>

<div class="tarjeta">
<h2>Java</h2>
<button onclick="mostrar('p2')">Enseñar</button>
<div class="info" id="p2">
<p>Java se usa para aplicaciones y sistemas.</p>
</div>
</div>

<div class="tarjeta">
<h2>HTML</h2>
<button onclick="mostrar('p3')">Enseñar</button>
<div class="info" id="p3">
<p>HTML crea la estructura de páginas web.</p>
</div>
</div>

</div>

<script>
function entrar(){
    var codigo = document.getElementById("codigo").value;

    if(codigo == "ACCESO2026"){
        document.getElementById("login").style.display = "none";
        document.getElementById("pagina").style.display = "block";
    }
    else{
        document.getElementById("error").innerHTML = "ERROR DE INGRESO";
    }
}

function mostrar(id){
    var x = document.getElementById(id);

    if(x.style.display == "block"){
        x.style.display = "none";
    }
    else{
        x.style.display = "block";
    }
}
</script>

</body>
</html>
